# lines — 5 mm squared paper, every fifth line accented. A4.
# Regenerate:  ctrlgrid -d examples/01-lines-squared.yaml -o out.pdf
version: 1

defs:
  fine:   &fine   "#c9d4e0"
  accent: &accent "#3f6fb0"

page:
  format: a4
  margin: 12mm

generator: lines
families:
  # The accent is first in each cycle, so the edge line starts heavy and every
  # fifth line after it is heavy too — a bold origin, the graph-paper way.
  - direction: horizontal
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
  - direction: vertical
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
