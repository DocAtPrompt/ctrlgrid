# lines — 5 mm squared paper filling the whole page. A4.
#
# This is the "as much as fits" convention: cells fill right up to the edges, so
# the last block of major lines may be incomplete — a thick line that no longer
# fits is simply left off. Only whole cells are ever drawn; the small leftover
# under one cell stays blank margin, never a partial cell.
#
# For the other convention — only complete 25 mm blocks, every edge a heavy line
# — see 01b-lines-squared-blocks.yaml, which sets `snap: cycle`.
# Regenerate:  ctrlgrid -d examples/01-lines-squared.yaml -o out.pdf
version: 1

defs:
  fine:   &fine   "#c9d4e0"
  accent: &accent "#3f6fb0"

page:
  format: a4
  margin: 12mm

pattern:
  # Flush at the origin and let the small sub-cell leftover sit blank at the far
  # edge, rather than centring it.
  remainder: { x: end, y: end }

generator: lines
families:
  # Accent first, so a heavy major line every fifth cell starts at the origin.
  - direction: horizontal
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
  - direction: vertical
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
