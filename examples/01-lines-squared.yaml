# lines — 5 mm squared paper, every fifth line a heavy major. A4.
#
# `snap: cycle` is the convention that only *whole* cells are drawn: the pattern
# area is rounded down to a whole number of 25 mm major blocks, so every edge is
# a heavy line and no partial cell is ever drawn — whatever does not make a whole
# block is left as blank margin. It also keeps that true on any other format.
# Regenerate:  ctrlgrid -d examples/01-lines-squared.yaml -o out.pdf
version: 1

defs:
  fine:   &fine   "#c9d4e0"
  accent: &accent "#3f6fb0"

page:
  format: a4
  margin: 12mm

pattern:
  snap: { x: cycle, y: cycle }   # only whole major blocks — no partial cells

generator: lines
families:
  # Accent first, so every major block opens with a heavy line and all four
  # edges of the grid are heavy.
  - direction: horizontal
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
  - direction: vertical
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
