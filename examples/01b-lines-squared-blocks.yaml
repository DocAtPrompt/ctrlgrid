# lines — 5 mm squared paper, complete 25 mm blocks only. A4.
#
# This is the "only complete patterns" convention: `snap: cycle` rounds the
# pattern area down to a whole number of 25 mm major blocks, so every edge of the
# grid is a heavy major line and no block is ever partial. Whatever does not make
# a whole block stays as blank margin.
#
# The companion 01-lines-squared.yaml fills the whole area instead, leaving the
# last block incomplete. Flip `snap` between the two to choose.
# Regenerate:  ctrlgrid -d examples/01b-lines-squared-blocks.yaml -o out.pdf
version: 1

defs:
  fine:   &fine   "#c9d4e0"
  accent: &accent "#3f6fb0"

page:
  format: a4
  margin: 12mm

pattern:
  snap: { x: cycle, y: cycle }   # only whole major blocks — every edge heavy

generator: lines
families:
  - direction: horizontal
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
  - direction: vertical
    base_spacing: 5mm
    base_weight: 0.15pt
    weight: [2, 1, 1, 1, 1]
    color: [*accent, *fine, *fine, *fine, *fine]
