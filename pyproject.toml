[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrlgrid"
# Read from ctrlgrid/__init__.py, so there is one version and not two. The
# release workflow compares the git tag against `ctrlgrid.__version__`, and
# that check only means something if the package cannot disagree with itself.
dynamic = ["version"]
description = "Dimensionally accurate PDF templates: grid paper, staves, mazes, polar targets, tilings, forms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "DocAtPrompt (Alexander Erben)" }]
keywords = ["pdf", "graph-paper", "grid", "template", "eink", "remarkable"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Utilities",
]

# Kept deliberately small. Pillow (PNG writer, M7) and fontTools (embedded
# fonts, M2) join when the milestones that need them arrive — see § 13 of the
# specification.
dependencies = [
    "pydantic>=2.0",
    "reportlab>=4.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pypdf>=4.0",     # reads generated PDFs back for the dimensional test
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/DocAtPrompt/ctrlgrid"
Issues = "https://github.com/DocAtPrompt/ctrlgrid/issues"

[project.scripts]
ctrlgrid = "ctrlgrid.cli:main"

[tool.hatch.version]
path = "ctrlgrid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ctrlgrid"]

[tool.hatch.build]
# Data files are part of the package: formats, device profiles, presets.
# Presets are documentation (§ 9.3), so they ship.
artifacts = ["ctrlgrid/data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
