# calendar — a linked, write-on year planner for the reMarkable (or paper). A4.
#
# The preset is the documentation for `calendar` (§ 7, § 9.3): copy it with
# `ctrlgrid show calendar-a4 > mine.yaml` and bend it. It builds one PDF of ~400
# linked pages — tap a date with the pen and land on that day, tap a note number
# and land on that note. Every page is exactly one page: if a view is too small,
# use the device's zoom. Change `year` and the names to your language.
#
# The links are internal PDF GoTo links (they work on the reMarkable); the whole
# thing is deterministic, so the same definition always gives the same PDF.
version: 1

page:
  format: a4
  margin: 12mm

# Optional, constant on every page — the year and a personalization, no page
# numbers (they are meaningless in a linked document). `{year}` is filled in.
header:
  height: 7mm
  gap: 3mm
  font: { size: 9pt }
  center: "{year}"
  right: "your name"
  # background: "#2f3a48"   # a full-width colour strip behind the band
  # text_color: "#ffffff"   # the band's text colour (default black)

generator: calendar
year: 2026
week_start: monday        # or sunday

# Names come from here — English by default. List your own for another language.
months:
  - January
  - February
  - March
  - April
  - May
  - June
  - July
  - August
  - September
  - October
  - November
  - December
weekdays: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]

# Marked days: holidays, birthdays, anniversaries — the calendar treats them
# alike. Each fills its cell in the half-year table, its row on the month page,
# its number in the full-year overview, and carries its label on the day page.
# `color` is per entry; entries without one take `holiday_color`.
holiday_color: "#fce9e4"
holidays:
  - { date: 2026-01-01, label: New Year }
  - { date: 2026-12-25, label: Christmas }
  # - { date: 2026-05-03, label: "Mama's birthday", color: "#ffd9ec" }
  # holidays_file: holidays.ics   # or a YAML list — see § 7.12

# What the colours mean. Optional: without it the contents page shows no key.
# The calendar knows the colours, never their meanings — so you name them.
# legend:
#   - { color: "#fce9e4", label: "Public holidays" }
#   - { color: "#ffd9ec", label: "Birthdays" }

# A cover: a full-page colour with a centred title and subtitle. Drop it for no
# title page.
title_page:
  title: "2026"
  subtitle: "your name"
  background: "#2f3a48"
  text_color: "#ffffff"
  # logo: logo.png     # optional PNG above the title (path relative to this file)
  # background_image: cover.png   # a full-sheet PNG over the colour; transparent
  #                               # areas show `background` through (path relative
  #                               # to this file)
  # background_fit: cover         # cover (fill, crop) | contain (fit inside)
  # header: false                 # show the header band on the cover too
  # footer: false                 # show the footer band on the cover too

# The half-year tables (Jan–Jun, Jul–Dec); a day cell jumps to its day page.
year_view: { weekend_shade: "#f0f2f5", cell_link: day }
# The month view: a list of every day; the writing surface next to each date.
month_view: { weekend_shade: "#f0f2f5", surface: lines }
# The week view is opt-in — drop it to leave the ~53 week pages out. Each is one
# page: seven day sections in week_start order plus a tasks/notes column.
week_view: { surface: lines, tasks: true }

# The day page — an ordered list of blocks. Reorder, resize, drop or repeat.
day:
  blocks:
    # `half_hours: true` rules the half hours too — the hour line then steps
    # up a shade so the half stays subordinate.
    - { type: schedule, from: 7, to: 22, height: 55%, surface: lines }
    - { type: todo,     rows: 8,          height: 20% }
    - { type: notes,    height: rest,     surface: grid }

# Note pages and their numbered index; the index paginates if `count` is large.
notes:
  count: 20
  surface: dots           # blank | lines | dots | grid
